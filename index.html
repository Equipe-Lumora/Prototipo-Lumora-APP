<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EstudAI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="app-container">

        <!-- TELA 1: ÁLBUNS (INICIAL) -->
        <div id="view-albuns" class="view">
            <header class="main-header">
                <h1>EstudAI</h1>
                <hr class="header-divider">
            </header>

            <main class="content">
                <!-- Seção Não Catalogado -->
                <section class="section">
                    <h2 class="section-title">Não catalogado</h2>
                    <div class="catalog-card" id="btn-nao-catalogado" style="cursor: pointer;">
                        <div class="catalog-icon-bg"></div>
                        <div class="catalog-info">
                            <h3>Rolo de câmera</h3>
                            <p id="cnt-nao-catalogado">0 imagens recentes</p>
                        </div>
                    </div>
                </section>

                <!-- Seção Álbuns -->
                <section class="section">
                    <h2 class="section-title">Álbuns</h2>
                    <div class="albums-grid" id="albums-container">
                        <div class="create-album-card dashed-border" id="btn-novo-album">
                            <div class="dashed-content">
                                <span class="create-icon">+</span>
                                <p>Criar novo album</p>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <!-- TELA 2: DETALHES DO ÁLBUM OU FOTO -->
        <div id="view-detalhes" class="view hidden">
            <header class="main-header header-with-back">
                <button id="btn-back" class="btn-back">←</button>
                <h1 id="album-title">Química</h1>
            </header>
            <hr class="header-divider">

            <main class="content">
                <!-- Container de Imagens da Pasta -->
                <div id="imagens-container"></div>

                <div id="detalhes-vazio" class="hidden" style="text-align: center; color: #666; padding: 40px 0;">
                    <p>Nenhuma imagem nesta pasta ainda.</p>
                </div>
            </main>
        </div>

        <!-- MODAL DA CÂMERA -->
        <div id="modal-camera" class="modal hidden">
            <div class="modal-content camera-box">
                <h2>Câmera EstudAI</h2>
                <video id="camera-feed" autoplay playsinline></video>
                <canvas id="camera-canvas" class="hidden"></canvas>
                <div class="camera-actions">
                    <button id="btn-cancel-camera" class="btn-action dashed">Cancelar</button>
                    <button id="btn-take-photo" class="btn-action primary">Tirar Foto</button>
                </div>
            </div>
        </div>

        <!-- MODAL DE SELEÇÃO DE PASTA -->
        <div id="modal-select-folder" class="modal hidden">
            <div class="modal-content">
                <h2>Guardar Imagem</h2>
                <p>Em qual pasta você deseja armazenar esta imagem?</p>
                <select id="select-folder-input" class="folder-select">
                    <option value="">Não Catalogado (Rolo de câmera)</option>
                </select>
                <div class="modal-actions">
                    <button id="btn-save-photo" class="btn-action primary">Salvar</button>
                </div>
            </div>
        </div>

        <!-- MODAL DE CRIAR FLASHCARD MANUALMENTE -->
        <div id="modal-flashcard" class="modal hidden">
            <div class="modal-content">
                <h2>Novo Flashcard</h2>
                <input type="text" id="fc-pergunta" class="folder-select" placeholder="Pergunta do card..." style="margin-bottom:10px;">
                <textarea id="fc-resposta" class="folder-select" placeholder="Resposta..." rows="3" style="margin-bottom:15px; resize:none;"></textarea>
                <div class="modal-actions">
                    <button id="btn-cancel-fc" class="btn-action dashed">Cancelar</button>
                    <button id="btn-save-fc" class="btn-action primary">Salvar Card</button>
                </div>
            </div>
        </div>

        <!-- Botão Flutuante -->
        <button id="fab-button" class="floating-action-button" aria-label="Tirar Foto">
            <img src="images/camera.svg" alt="Câmera" class="fab-svg-icon" onerror="this.outerHTML='📷'">
        </button>

    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
